<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="form.css">
    <script src="form.js" defer></script>
</head>
<body>
    <div>
    <h1>Formulario de   Empleado</h1>
    <form action="/submit" method="post">
        <label for="name">Nombre:</label>
        <input type="text" id="name" name="name" required><br><br>

        <label for="correo">Correo:</label>
        <input type="text" id="correo" name="correo" required><br><br>

        <label for="contraseña">Contraseña:</label>
        <input type="password" id="contraseña" name="contraseña" required><br><br>

        <fieldset>
            <legend>¿Es Empleado?</legend>
            <input type="radio" id="Si" name="esEmpleado" value="Si" required>
            <label for="Si">Sí</label>
            <input type="radio" id="No" name="esEmpleado" value="No">
            <label for="No">No</label>
        </fieldset>
        <div id="container"></div>
    </form>
    </div>
</body>
</html>
