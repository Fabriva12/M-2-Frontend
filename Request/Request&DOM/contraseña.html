<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=Nue">
    <title>Nueva Contraseña</title>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="contraseña.js" defer></script>
</head>

<body>

    <h2>Cambiar Contraseña</h2>

    <input type="text" id="userId" placeholder="ID del usuario">
    <input type="password" id="oldPassword" placeholder="Contraseña actual">
    <input type="password" id="newPassword" placeholder="Nueva contraseña">
    <input type="password" id="confirmPassword" placeholder="Confirmar nueva contraseña">

    <button id="changeBtn">Cambiar contraseña</button>

    <p id="message"></p>

    <script src="change-password.js"></script>
</body>

</html>

</html>
